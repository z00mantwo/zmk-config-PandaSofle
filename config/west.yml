    # zmk-feature-scaling is a ZMK input processor that evaluates a configurable acceleration curve 
    # on frame-based pointer input while preserving the resulting direction vector. Trackball?
    # https://github.com/iwk7273/zmk-feature-scaling

    # ZMK Feature: XY Clipper
    # This is a ZMK input processor module to clip relative XY movement deltas from sensors like trackballs or optical sensors.
    # https://github.com/iwk7273/zmk-feature-xy_clipper
    
    # ZMK ESB Split Transport
