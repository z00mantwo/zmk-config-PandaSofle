manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
      
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects

    # support nice_oled and nice_epaper
    #- name: mctechnology17
    #  url-base: https://github.com/mctechnology17

    # https://github.com/M165437/nice-view-gem
    - name: m165437 #new entry
      url-base: https://github.com/M165437 #new entry  

    # ZMK Feature: Charge Indicator
    # https://github.com/4mplelab/zmk-feature-charge-indicator
    #- name: 4mplelab
    #url-base: https://github.com/4mplelab
      
    # https://github.com/badjeff/zmk-feature-split-esb
    #- name: badjeff
    #  url-base: https://github.com/badjeff
    #- name: nrfconnect
    #  url-base: https://github.com/nrfconnect    

    # zmk-rgbled-widget 
    - name: caksoylar  # <-- new entry
      url-base: https://github.com/caksoylar

    # ZMK Layer Status
    # https://github.com/maatthc/zmk-feature-appcompanion
    # used with Keyboard Layers App Companion
    # https://github.com/maatthc/keyboard_layers_app_companion
    - name: maatthc
      url-base: https://github.com/maatthc

    # KeyPeek provides a live on-screen overlay of your keyboard, mirroring the active base and momentary layers. 
    # It is especially useful when learning complex multi-layer layouts or using boards with missing legends. 
    # The overlay updates instantly when layers change, so the view always matches your firmware state. 
    # https://github.com/srwi/keypeek
    - name: zzeneg # <-- required for Raw HID module
      url-base: https://github.com/zzeneg
    - name: srwi # <-- required for KeyPeek module
      url-base: https://github.com/srwi
      
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      #revision: v0.3
      #revision: v0.3.0
      #revision: v0.2
      import: app/west.yml
      
    # support nice_oled and nice_epaper
    #- name: zmk-nice-oled
    #  remote: mctechnology17
    #  revision: main

    - name: nice-view-gem #new entry
      remote: m165437 #new entry
      revision: main #new entry

    # ZMK Feature: Charge Indicator
