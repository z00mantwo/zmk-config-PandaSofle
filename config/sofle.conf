# Vertical widgets for oled
# https://github.com/mctechnology17/zmk-nice-oled

CONFIG_ZMK_KEYBOARD_NAME="SofleChoc"

# Enable split keyboard support
CONFIG_ZMK_SPLIT=y
# y for central device, n for peripheral
#CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
# Use BLE to communicate between split keyboard halves
CONFIG_ZMK_SPLIT_BLE=y


# Enable ZMK Studio for Realtime Keymap Updates
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Enable eager debouncing
#CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
#CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7

CONFIG_ZMK_SLEEP=y
# Go to sleep after one hour (1*60*60*1000ms)
# Default is 900,000 milliseconds or 15 minutes.
#CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
# Milliseconds of inactivity before entering idle state
#CONFIG_ZMK_IDLE_TIMEOUT=30000
# Enable soft off functionality from the keymap or dedicated hardware
#CONFIG_ZMK_PM_SOFT_OFF=y

# ZMK only supports full duplex, 2 wire serial. Sofle board is setup for half duplex, 1 wire.
#CONFIG_ZMK_SPLIT_WIRED=y

# Enables/disables all battery level detection/reporting
# While CONFIG_ZMK_BATTERY_REPORTING is disabled by default it is implied by CONFIG_ZMK_BLE, 
# thus any board with BLE enabled will have this automatically enabled unless explicitly overridden.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
# You can configure ZMK to allow support for peripheral battery monitoring over BLE (e.g. when having a split keyboard with two independent and wirelessly connected sides). 
# If you want to report the battery levels of both sides of a split keyboard, you should have both
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Enable receipt of HID/LED indicator state from connected hosts
CONFIG_ZMK_HID_INDICATORS=y
# Enable split keyboard support for passing indicator state to peripherals
#CONFIG_ZMK_SPLIT_PERIPHERAL_HID_INDICATORS=y
# Enable CONFIG_ZMK_HID_KEYBOARD_REPORT_SIZE key roll over.
#CONFIG_ZMK_HID_REPORT_TYPE_HKRO=y
# Enable full N-key roll over. This may prevent the keyboard from working with some BIOS/UEFI versions.
#CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
# Enable all consumer key codes, but may have compatibility issues with some host OSes
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y
# Prevents using some consumer key codes, but allows compatibility with more host OSes
#CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

#CONFIG_USB=y
#CONFIG_ZMK_USB=y

# Turn on logging, and set ZMK logging to debug output
# CONFIG_ZMK_USB_LOGGING=n

# Enable 32kHz crystal. Leave off to save battery?
#CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
#CONFIG_CLOCK_CONTROL_NRF_K32SRC_30PPM=y

# Uncomment this line below to add rgb underglow / backlight support
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=10
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
# CONFIG_ZMK_RGB_UNDERGLOW_EFF_START: 0 Solid color, 1 Breathe, 2 Spectrum, 3 Swirl
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0            
# Uncomment the line below to disable external power toggling by the underglow.
# By default toggling the underglow on and off also toggles external power
# on and off. This also causes the display to turn off.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
# Automatically turn off underglow when keyboard is not touched for 30s
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Uncomment these two lines to add support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
#CONFIG_EC11_TRIGGER_OWN_THREAD=y      # Causes lockup.

# EXT POWER
CONFIG_ZMK_EXT_POWER=y

# MOUSE
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Boost Bluetooth TX Power to hopefully help with iPad
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

#CONFIG_ZMK_BACKLIGHT=y
#CONFIG_ZMK_BACKLIGHT_BRT_START=80
#CONFIG_ZMK_BACKLIGHT_ON_START=y
#CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n

# Uncomment the following line to enable the Sofle OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
#CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y

#CONFIG_ZMK_WIDGET_LAYER_STATUS=y
#CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
#CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
# Use a dedicated thread for UI updates
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
#CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Uncomment the following line to after compiling both to get left wpm tracking
#CONFIG_ZMK_WPM=y
#CONFIG_ZMK_WIDGET_WPM_STATUS=y

# ========================================================================================================
# 
# Uncomment the following line if you facing issue on win 11 connection
# Enables a combination of settings that are planned to be default in future versions of ZMK to improve connection stability. 
# This includes changes to timing on BLE pairing initiation, restores use of the updated/new LLCP implementation, and disables 2M PHY support.
#CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# Aggregate config that enables both CONFIG_ZMK_BLE_EXPERIMENTAL_CONN and CONFIG_ZMK_BLE_EXPERIMENTAL_SEC.
#CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
#CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# ========================================================================================================
# nice!view Disable custom widget. Traditional OLED look, but on nice!view. Works.
# https://github.com/zmkfirmware/zmk/tree/main/app/boards/shields/nice_view#disable-custom-widget
#CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
#CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_26=y
#CONFIG_LV_FONT_DEFAULT_MONTSERRAT_26=y
#CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# ========================================================================================================
# ZMK ESB Split Transport
# https://github.com/badjeff/zmk-feature-split-esb
# disable BLE on peripheral
# NOTE: keep default (=y) if want to pairing BLE host on split central, or wireless dongle
#CONFIG_ZMK_BLE=n

# disable default split transport on central and peripheral
#CONFIG_ZMK_SPLIT_BLE=n
#CONFIG_ZMK_SPLIT_WIRED=n

# enable split esb transport
#CONFIG_ZMK_SPLIT_ESB=y

# assige a source id on peripheral. (no need for central)
# default zero. give an integer (<256) on all peripheral(s)
#CONFIG_ZMK_SPLIT_ESB_PERIPHERAL_ID=1

# enable ESB TX send request packet payload with ACK bit
# ESB protocol has built-in retransmit counter (default one), if RX does not response ACK properly.
# disable this iif you are pursuing extreme low latency, not much different in real-life.
#CONFIG_ZMK_SPLIT_ESB_PROTO_TX_ACK=y

# The delay between each retransmission of unacknowledged packets
# NOTE: radio will chock if too short
#CONFIG_ZMK_SPLIT_ESB_PROTO_TX_RETRANSMIT_DELAY=600

# The number of retransmission attempts before transmission fail
# NOTE: applying less retransmit count on pointer device will lead to lossy but sharper move
#CONFIG_ZMK_SPLIT_ESB_PROTO_TX_RETRANSMIT_COUNT=32

# The number of Multi-Protocol Service Layer (MPSL) timeslot sessions
# set 1, if CONFIG_ZMK_BLE is disabled on central or peripherals
# set 2, if CONFIG_ZMK_BLE is enabled on central, which needs BLE and ESB simultaneously
#CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1

# Number of message queue size to buffer ESB payload for TX in between multi-protocol service 
# timeslots (CONFIG_MPSL_TIMESLOT_SESSION_COUNT)
#CONFIG_ZMK_SPLIT_ESB_PROTO_MSGQ_ITEMS=16

# qeuue size for both peripheral (EVENT) and central (CMD)
#CONFIG_ZMK_SPLIT_ESB_EVENT_BUFFER_ITEMS=16
#CONFIG_ZMK_SPLIT_ESB_CMD_BUFFER_ITEMS=4

# another IMPORTANT config for ESB
#CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
#CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
#CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
#CONFIG_ESB_TX_FIFO_SIZE=32

# Logging!
# CONFIG_ZMK_SPLIT_ESB_LOG_LEVEL_DBG=y

